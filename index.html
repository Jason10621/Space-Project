<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAFS Deep Space Navigator V4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js 및 애니메이션 코어 -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body class="dark-mode">
    
    <header>
        <div class="header-container">
            <div class="hafs-logo">HAFS</div>
            <div class="title-group">
                <h1>DEEP SPACE NAVIGATOR</h1>
                <p>Macro-to-Micro Universe Explorer (JWST Data based)</p>
            </div>
            <div class="system-status">
                <span class="status-dot"></span> <span id="status-text">WARP DRIVE READY</span>
            </div>
        </div>
    </header>

    <!-- 3D 시각화가 전체 화면의 배경으로 깔립니다 -->
    <div id="three-container" class="fullscreen-viz"></div>

    <!-- 좌측 하단: 타겟 내비게이터 -->
    <div class="hud-panel left-hud">
        <h2>UNIVERSE MAP</h2>
        <p class="hud-desc">관측 목표를 선택하여 초공간 도약을 시작하세요.</p>
        
        <div class="target-list">
            <button class="target-btn active" data-target="home">
                <span class="btn-title">MILKY WAY (우리은하)</span>
                <span class="btn-dist">Distance: 0 Light Years</span>
            </button>
            <button class="target-btn" data-target="carina">
                <span class="btn-title">CARINA NEBULA (용골자리 성운)</span>
                <span class="btn-dist">Distance: 8,500 Light Years</span>
            </button>
            <button class="target-btn" data-target="stephan">
                <span class="btn-title">STEPHAN'S QUINTET (오중주 은하군)</span>
                <span class="btn-dist">Distance: 290 Million Light Years</span>
            </button>
            <button class="target-btn" data-target="smacs">
                <span class="btn-title">SMACS 0723 (중력렌즈 은하단)</span>
                <span class="btn-dist">Distance: 4.6 Billion Light Years</span>
            </button>
        </div>
    </div>

    <!-- 우측 하단: 천체 상세 정보 (초공간 도약 후 표시됨) -->
    <div class="hud-panel right-hud" id="info-hud" style="opacity: 0; pointer-events: none;">
        <h2 id="info-title" style="color: var(--color-jwst-gold);">TARGET INFO</h2>
        <p id="info-desc" class="hud-desc" style="margin-bottom: 15px;">설명</p>
        
        <h3 style="font-family: var(--font-data); font-size: 12px; border-bottom: 1px solid #555; padding-bottom: 5px; margin-bottom: 10px;">SUB-SYSTEMS (내부 구조)</h3>
        <ul id="sub-systems-list" class="sub-list">
            <!-- JS에서 동적으로 내부 계(System) 정보가 추가됩니다 -->
        </ul>
        
        <div class="telemetry-box" style="margin-top: 20px;">
            <div class="telemetry-row">
                <span>OBSERVATION INSTRUMENT</span>
                <span class="mono-data">JWST NIRCam & MIRI</span>
            </div>
            <div class="telemetry-row">
                <span>ESTIMATED SCALE</span>
                <span id="info-scale" class="mono-data">--</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
